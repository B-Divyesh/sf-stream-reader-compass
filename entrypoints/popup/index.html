<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reader controls — Stream Reader Compass</title>
  </head>
  <body>
    <main>
      <p class="kicker">Stream Reader Compass</p>
      <h1>Read this chat in order</h1>
      <p id="site" class="site">Checking this site…</p>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <button id="enable" type="button">Enable on this site</button>
      <button id="open" class="secondary" type="button" hidden>Open transcript reader</button>
      <p class="note">Content stays in this browser. Enable this site before opening the reader.</p>
      <a href="https://stream-reader-compass.sociobot.in/privacy" target="_blank" rel="noreferrer">Read the privacy notice <span class="sr-only">(opens in a new tab)</span></a>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
